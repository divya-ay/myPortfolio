<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#4a1a3a"/>
      <stop offset="60%" stop-color="#2a0d22"/>
      <stop offset="100%" stop-color="#150710"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f0a6e0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f0a6e0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid4" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="600" fill="url(#bg4)"/>
  <rect width="400" height="600" fill="url(#grid4)"/>
  <rect width="400" height="600" fill="url(#glow4)"/>

  <!-- two overlapping orbit rings (collaboration) + pi symbol (math) -->
  <circle cx="175" cy="255" r="70" fill="none" stroke="#f3c3ea" stroke-width="1.6" stroke-opacity="0.55"/>
  <circle cx="225" cy="255" r="70" fill="none" stroke="#f3c3ea" stroke-width="1.6" stroke-opacity="0.55"/>
  <text x="200" y="290" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="92" font-weight="600" fill="#f8e3f4">&#960;</text>

  <text x="200" y="470" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3" fill="#f3c3ea" opacity="0.85">MATHE · 2025</text>
  <text x="200" y="500" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600" fill="#f4f1ea">Collaboration</text>
</svg>
