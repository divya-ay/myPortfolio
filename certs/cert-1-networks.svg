<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#1a4a3a"/>
      <stop offset="60%" stop-color="#0d2a22"/>
      <stop offset="100%" stop-color="#071510"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#4ee3ad" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4ee3ad" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid1" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="600" fill="url(#bg1)"/>
  <rect width="400" height="600" fill="url(#grid1)"/>
  <rect width="400" height="600" fill="url(#glow1)"/>

  <!-- network topology motif -->
  <g stroke="#8fe8c8" stroke-width="1.6" stroke-opacity="0.85" fill="none">
    <line x1="200" y1="230" x2="130" y2="300"/>
    <line x1="200" y1="230" x2="270" y2="300"/>
    <line x1="200" y1="230" x2="200" y2="150"/>
    <line x1="130" y1="300" x2="90" y2="360"/>
    <line x1="130" y1="300" x2="150" y2="365"/>
    <line x1="270" y1="300" x2="250" y2="365"/>
    <line x1="270" y1="300" x2="310" y2="360"/>
  </g>
  <g fill="#dffff2">
    <circle cx="200" cy="150" r="9"/>
    <circle cx="200" cy="230" r="12"/>
    <circle cx="130" cy="300" r="8"/>
    <circle cx="270" cy="300" r="8"/>
    <circle cx="90" cy="360" r="6"/>
    <circle cx="150" cy="365" r="6"/>
    <circle cx="250" cy="365" r="6"/>
    <circle cx="310" cy="360" r="6"/>
  </g>

  <text x="200" y="470" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3" fill="#8fe8c8" opacity="0.85">CCNA · CISCO</text>
  <text x="200" y="500" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="600" fill="#f4f1ea">Networks</text>
</svg>
